<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Semantic Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --surface-1: #18181b;
            --surface-2: #27272a;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --glass-bg: rgba(24, 24, 27, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Ambient Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .container {
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .tag {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
            padding: 0.4em 1em;
            border-radius: 99px;
            display: inline-block;
            margin-bottom: 1rem;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Controls */
        .input-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .label {
            display: block;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;
            transition: transform 0.2s;
        }

        .input-wrapper:focus-within {
            transform: scale(1.01);
        }

        input, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: rgba(0, 0, 0, 0.5);
        }

        textarea {
            resize: none;
            min-height: 120px;
        }

        /* Presets */
        .presets {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .preset-chip {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preset-chip:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        .preset-chip svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        /* Button */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            border: none;
            padding: 1.25rem;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px -10px var(--primary-glow);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        .btn-main::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -12px var(--primary-glow);
        }

        .btn-main:hover::after {
            opacity: 1;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-main:disabled {
            opacity: 0.7;
            cursor: wait;
            filter: grayscale(1);
        }

        /* Results */
        .results {
            margin-top: 3rem;
            display: none;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        
        .result-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-content {
            line-height: 1.6;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        .code-block {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #d4d4d8;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        /* Icons/Colors */
        .icon-reason { color: #c084fc; }
        .icon-summary { color: var(--success); }
        .icon-raw { color: var(--text-muted); }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: text-bottom;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <span class="tag">Inter-Agent Logic Core</span>
            <h1>Nexus Proxy</h1>
            <p class="subtitle">Semantic middleware for autonomous agent communication</p>
        </div>

        <div class="input-group">
            <label class="label">
                Target Agent URL
                <span class="tag" style="margin:0; font-size:0.6em; padding: 2px 8px; border-radius: 4px;">Optional (Auto-Discovery Mode)</span>
            </label>
            <div class="input-wrapper">
                <input type="text" id="targetUrl" placeholder="Leave empty to let AI find the agent...">
            </div>
        </div>

        <div class="presets">
            <div class="preset-chip" onclick="setPreset('', 'I want to cut my hair at 5pm')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-9M14 17H5M6 7l12 10M18 7l-9 8"/></svg>
                Find Haircut Agent
            </div>
            <div class="preset-chip" onclick="setPreset('', 'Borrow ISBN 978-3-16-148410-0 for a week')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Find Library Agent
            </div>
        </div>

        <div class="input-group">
            <label class="label">User Intent</label>
            <div class="input-wrapper">
                <textarea id="userIntent" placeholder="Describe your request in natural language..."></textarea>
            </div>
        </div>

        <button id="sendBtn" class="btn-main" onclick="sendRequest()">
            Execute Protocol
        </button>

         <!-- Mission Control View -->
        <div id="missionControl" style="display:none; margin-top: 2rem;">
            <div class="mission-header">
                <h2 id="missionTitle">Mission Active</h2>
                 <span class="tag" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border-color: rgba(16, 185, 129, 0.2);">LIVE ORCHESTRATION</span>
            </div>
            <div id="agentGrid" class="agent-grid">
                <!-- Agent Cards injected here -->
            </div>
        </div>
        
        <!-- Result Area (Legacy/Global logs) -->
        <div id="result" class="results"></div>
    </div>
</div>

    <style>
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .agent-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .agent-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 20px -5px rgba(139, 92, 246, 0.3);
            background: rgba(139, 92, 246, 0.05);
        }

        .agent-card.success {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .agent-card.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .agent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .agent-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        .agent-status-icon {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: var(--text-muted);
        }

        .task-desc {
            font-size: 0.95rem;
            color: #d1d5db;
            margin-bottom: 1rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .verification-box {
            font-size: 0.8rem;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            color: var(--text-muted);
            border-left: 2px solid var(--accent);
            margin-top: auto;
        }

        .verification-box strong {
            display: block;
            color: var(--accent);
            margin-bottom: 2px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
    </style>

     <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
    const agentGrid = document.getElementById('agentGrid');
    const missionControl = document.getElementById('missionControl');
    const missionTitle = document.getElementById('missionTitle');

    function setPreset(url, intent) {
        const urlInput = document.getElementById('targetUrl');
        const intentInput = document.getElementById('userIntent');
        
        urlInput.value = url;
        intentInput.value = intent;

        // Flash effect
        intentInput.style.borderColor = '#06b6d4';
        setTimeout(() => {
            intentInput.style.borderColor = '';
        }, 300);
    }

    async function sendRequest() {
        const targetUrl = document.getElementById('targetUrl').value;
        const userIntent = document.getElementById('userIntent').value;
        const btn = document.getElementById('sendBtn');
        const resultArea = document.getElementById('result');

        if (!userIntent) {
            alert("Please provide an Intent.");
            return;
        }

        // Loading State
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Processing Signal...';
        resultArea.style.display = 'block';
        resultArea.innerHTML = ''; // Start clean

        // Session Management
        let sessionId = localStorage.getItem('proxy_session_id');
        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem('proxy_session_id', sessionId);
        }
        console.log("Session ID:", sessionId);

        try {
            const response = await fetch('http://localhost:3000/proxy/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetUrl, userIntent, sessionId })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                
                let boundary = buffer.indexOf('\n');
                while (boundary !== -1) {
                    const line = buffer.substring(0, boundary).trim();
                    buffer = buffer.substring(boundary + 1);
                    
                    if (line) {
                        try {
                            const event = JSON.parse(line);
                            handleStreamEvent(event, resultArea);
                        } catch (e) {
                            console.warn("Standard Parse Failed:", e);
                            // Fallback: Check for merged JSONs like }{
                            const fixedLine = line.replace(/}{/g, '}\n{');
                            const parts = fixedLine.split('\n');
                            for (const part of parts) {
                                try {
                                    handleStreamEvent(JSON.parse(part), resultArea);
                                } catch (e2) {
                                     console.error("Fatal Parse Error. Line:", part);
                                     resultArea.innerHTML += `<div style="color:red; font-size:0.8em; padding:5px;">Parse Error: ${e2.message} <br> Raw: ${part}</div>`;
                                }
                            }
                        }
                    }
                    boundary = buffer.indexOf('\n');
                }
            }

        } catch (error) {
            resultArea.innerHTML += `
                <div class="result-card" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1);">
                    <div class="result-header" style="color: #ef4444;">Connection Error</div>
                    <div class="result-content">${error.message}</div>
                </div>
            `;
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Execute Protocol';
        }
    }

    function handleStreamEvent(event, globalContainer) {
        // Global events that don't fit into cards (like generic errors or done messages)
        if (event.type === 'error' && !event.agentName) {
             globalContainer.innerHTML += `
                <div class="result-card" style="border-color: #ef4444;">
                    <div class="result-header" style="color: #ef4444;">System Error</div>
                    <div class="result-content">${event.message}</div>
                </div>`;
            return;
        }

        if (event.type === 'done') {
             globalContainer.innerHTML += `<div style="text-align:center; color:#10b981; font-weight:bold; margin-top:20px;">✨ Mission Accomplished</div>`;
             return;
        }

        // --- MISSION START: Initialize Grid ---
        if (event.type === 'mission_start') {
            missionControl.style.display = 'block';
            missionTitle.textContent = event.missionName || "Mission Active";
            agentGrid.innerHTML = ''; // Interaction Reset
            
            event.tasks.forEach(task => {
                const card = document.createElement('div');
                card.id = `card-${task.agentName.replace(/\s+/g, '-')}`;
                card.className = 'agent-card';
                card.innerHTML = `
                    <div class="agent-header">
                        <span class="agent-name">${task.agentName}</span>
                        <span class="agent-status-icon" id="status-${task.agentName.replace(/\s+/g, '-')}">IDLE</span>
                    </div>
                    <div class="task-desc">
                        ${task.subIntent}
                    </div>
                    <div class="verification-box">
                        <strong>Verification Target</strong>
                        ${task.verification || "No specific criteria sent."}
                    </div>
                `;
                agentGrid.appendChild(card);
            });
            return;
        }

        // --- AGENT UPDATE: Status/Result ---
        if (event.agentName) {
            const safeName = event.agentName.replace(/\s+/g, '-');
            const card = document.getElementById(`card-${safeName}`);
            const statusBadge = document.getElementById(`status-${safeName}`);

            if (!card) return; // Should not happen if mission_start ran correctly

            if (event.type === 'status') {
                card.classList.add('active');
                // Spinner on Shadow/Right side or just cleaner
                statusBadge.innerHTML = `RUNNING <div class="spinner" style="width:10px;height:10px;border-width:1px;margin-left:8px;margin-right:0;"></div>`;
                statusBadge.style.color = '#a78bfa';
                statusBadge.style.background = 'rgba(139, 92, 246, 0.2)';
                statusBadge.style.display = 'flex';
                statusBadge.style.alignItems = 'center';
            }
            
            else if (event.type === 'result') {
                card.classList.remove('active');
                card.classList.add('success');
                statusBadge.textContent = 'DONE';
                statusBadge.style.color = '#10b981';
                statusBadge.style.background = 'rgba(16, 185, 129, 0.2)';

                // Append Result Summary to card
                const summaryHtml = marked.parse(event.summary);
                const resultDiv = document.createElement('div');
                resultDiv.style.marginTop = '1rem';
                resultDiv.style.paddingTop = '1rem';
                resultDiv.style.borderTop = '1px solid rgba(255,255,255,0.1)';
                resultDiv.innerHTML = `
                    <div style="font-size:0.9rem; color:#e2e8f0;">${summaryHtml}</div>
                    <div style="font-size:0.8rem; color:#94a3b8; margin-top:8px;">Reasoning: ${event.reasoning.split('\n')[0]}...</div>
                `;
                card.querySelector('.task-desc').appendChild(resultDiv);
                
                // ALSO Render in Detailed Stream (Legacy View)
                const resultArea = document.getElementById('result');
                resultArea.style.display = 'block'; // Ensure visible
                
                const detailedHtml = `
                <div class="result-card" style="border-left: 3px solid #10b981; margin-bottom: 1rem; animation: fadeIn 0.5s ease;">
                    <div class="result-header icon-summary" style="display:flex; justify-content:space-between;">
                        <span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            ${event.agentName} Detailed Log
                        </span>
                    </div>
                    <div class="result-content">
                         <div style="font-size: 1.05em; color: #e2e8f0; margin-bottom: 1rem; line-height: 1.6;">
                            ${summaryHtml}
                        </div>
                         <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-size: 0.9em; margin-bottom: 1rem; border-left: 2px solid #a78bfa; color: #cbd5e1;">
                            <strong style="color: #a78bfa; display:block; margin-bottom:4px;">Reasoning:</strong>
                            ${event.reasoning ? marked.parse(event.reasoning) : 'None'}
                        </div>
                    </div>
                </div>`;
                const div = document.createElement('div');
                div.innerHTML = detailedHtml;
                resultArea.appendChild(div);
            }

            else if (event.type === 'error') {
                card.classList.remove('active');
                card.classList.add('error');
                statusBadge.textContent = 'FAILED';
                statusBadge.style.color = '#ef4444';
                
                const errDiv = document.createElement('div');
                errDiv.style.color = '#ef4444';
                errDiv.style.fontSize = '0.9rem';
                errDiv.style.marginTop = '1rem';
                errDiv.textContent = event.message;
                card.appendChild(errDiv);
            }
        }
    }
    </script>

</body>
</html>
